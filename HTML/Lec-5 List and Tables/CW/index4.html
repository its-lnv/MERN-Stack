<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <style>
        table,
        tr,
        td,
        th {
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>
</head>

<body>
    <div>
        <table>
            <thead>
                <tr>
                    <th rowspan="2"></th>
                    <th colspan="2">Average</th>
                    <th rowspan="2">Red Eyes</th>
                </tr>

                <tr>
                    <th>Height</th>
                    <th>Weight</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td><b>Males</b></td>
                    <td>1.9</td>
                    <td>0.003</td>
                    <td>40%</td>
                </tr>

                <tr>
                    <td><b>Females</b></td>
                    <td>1.7</td>
                    <td>0.002</td>
                    <td>43%</td>
                </tr>
            </tbody>

            <caption>A test table with merged cells</caption>


        </table>
    </div>
</body>

</html>
