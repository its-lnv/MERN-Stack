<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <style>
        table,
        tr,
        td,
        th {
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>
</head>

<body>
    <div>
        <h1>Tables</h1>
        <h3>Marksheet</h3>
        <table>
            <thead>
                <tr>
                    <th>Students</th>
                    <th>Maths</th>
                    <th>English</th>
                    <th>Hindi</th>
                    <th>Science</th>
                </tr>
            </thead>


            <tbody>
                <tr>
                    <td>Rohan</td>
                    <td>50</td>
                    <td>60</td>
                    <td>54</td>
                    <td>89</td>
                </tr>
                <tr>
                    <td>Shyam</td>
                    <td>18</td>
                    <td>36</td>
                    <td>85</td>
                    <td>91</td>
                </tr>
                <tr>
                    <td>Peter</td>
                    <td>78</td>
                    <td>12</td>
                    <td>55</td>
                    <td>45</td>
                </tr>
            </tbody>
            <caption><b><i>Score Card</i></b></caption>
            <tfoot>
                <th>Total</th>
                <th></th>
                <th></th>
                <th></th>
                <th></th>
            </tfoot>
        </table>
    </div>
</body>

</html>
