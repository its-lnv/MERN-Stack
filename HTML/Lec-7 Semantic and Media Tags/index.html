<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic & media tags</title>
</head>

<body>
    <header>Header
        <nav>Navigation</nav>
    </header>
    <main>Main Content
        <aside>Sidebar</aside>
        
        <figure>
            <img src="https://www.andcollege.du.ac.in/assets/front/images/sports/6.jpg" height="100px" width="200px" alt="Bhais ki aankh">
            <figcaption>AND College</figcaption>
        </figure>

        <video src="148594-794221537_tiny.mp4" height="100px" width="200px" controls muted loop poster="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRrnoeCDSTNv_vdY7dQ3yRL9g0bGCq9ZsTFWUiki63hrQ&s">Love</video>

        <iframe width="560" height="315" src="https://www.youtube.com/embed/yuTBItA6-GU?si=eIeWTEsX9w-eauPZ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

        <br>

        <iframe src="https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d411.2534501572809!2d77.26313870261826!3d28.54033516691109!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!2zMjjCsDMyJzI3LjMiTiA3N8KwMTUnNDcuNCJF!5e0!3m2!1sen!2sin!4v1784746349810!5m2!1sen!2sin" width="400" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

        <audio src="alexzavesa-calm-inspiring-piano-logo-short-version-518990.mp3" controls>Song</audio>

        <p>&lt;p&gt;This is a paragraph tag</p>
    </main>
    <footer>Footer</footer>
</body>

</html>
